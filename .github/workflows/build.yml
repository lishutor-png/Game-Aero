name: Build Web & Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-web:
    name: Build & Typecheck Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build production web bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
        run: npm run build

      - name: Upload Web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeroglide-web-dist
          path: dist/
          retention-days: 14

  build-android-apk:
    name: Build Android APK (Capacitor)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "Android SDK directory not found at $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          else
            echo "sdkmanager not found, using preinstalled Android SDK at $SDK_DIR"
          fi

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web assets for Android
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
        run: npm run build

      - name: Install Capacitor CLI & Android platform
        run: npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Initialize & sync Android Capacitor project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Configure Android icon & landscape orientation
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android:screenOrientation" "$MANIFEST"; then
            sed -i 's/<activity\([[:space:]]\|$\)/<activity android:screenOrientation="sensorLandscape"\1/' "$MANIFEST"
          fi
          if [ -f "public/pwa-512x512.png" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true
            for dir in android/app/src/main/res/mipmap-*dpi; do
              if [ -d "$dir" ]; then
                cp public/pwa-512x512.png "$dir/ic_launcher.png" || true
                cp public/pwa-512x512.png "$dir/ic_launcher_round.png" || true
              fi
            done
          fi

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroGlide-3D-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
